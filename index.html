<div id="app"><main style="font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123"><h2>🏙️ LIX CITY</h2><p>Loading…</p></main></div>
<script>
window.addEventListener('error',function(e){try{var a=document.getElementById('app');if(a&&!a.dataset.booted){a.innerHTML='<main style=\"font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123\"><h2>⚠️ LIX CITY</h2><p>حدث خطأ أثناء تحميل اللعبة.</p><p style=\"font-size:12px;opacity:.7\">'+String(e.message||'Unknown error')+'</p></main>'}}catch(_){} });
// LIX CITY — PERMANENT PLAYER SAVE
// Game updates must NEVER change this key.
const SAVE_KEY = "lixcity_player_save_v1";
const LEGACY_KEYS = ["lixcity_v10","lixcity_v09","lixcity_v06","lixcity_v05","lixcity_v04","lixcity_v03","lixcity_v02"];
const BACKUP_KEY = "lixcity_player_save_backup_v1";
const D={level:1,xp:0,coins:250,tickets:0,energy:10,maxEnergy:10,lastEnergyAt:Date.now(),house:1,pet:1,petPlayed:0,lastSpin:0,game:{target:1,runner:1,catch:1},missions:[{t:"Play any game",xp:40,done:false},{t:"Earn 50 Coins",xp:40,done:false},{t:"Finish Lix Target",xp:50,done:false},{t:"Feed & play with your Pet",xp:50,done:false},{t:"Visit your City",xp:30,done:false}],city:{x:43,y:48,pet:false,collected:[]}};
function cloneD(){return JSON.parse(JSON.stringify(D))}
function readState(k){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function normalizeState(raw){
  const s={...cloneD(),...(raw&&typeof raw==='object'?raw:{})};
  s.level=Math.max(1,Number(s.level)||1); s.xp=Math.max(0,Number(s.xp)||0); s.coins=Math.max(0,Number(s.coins)||0);
  s.tickets=Math.max(0,Number(s.tickets)||0); s.maxEnergy=Math.max(10,Number(s.maxEnergy)||10);
  s.energy=Math.max(0,Math.min(s.maxEnergy,Number(s.energy) || 0)); s.lastEnergyAt=Number(s.lastEnergyAt)||Date.now(); s.house=Math.max(1,Number(s.house)||s.level);
  s.pet=Math.max(1,Number(s.pet)||1); s.petPlayed=Number(s.petPlayed)||0; s.lastSpin=Number(s.lastSpin)||0;
  s.game={...D.game,...(s.game||{})};
  s.missions=Array.isArray(s.missions)?s.missions:cloneD().missions;
  s.city={...D.city,...(s.city||{})};
  s.city.x=Number.isFinite(Number(s.city.x))?Number(s.city.x):43; s.city.y=Number.isFinite(Number(s.city.y))?Number(s.city.y):48;
  s.city.pet=!!s.city.pet; s.city.collected=Array.isArray(s.city.collected)?s.city.collected:[];
  return s;
}
function scoreState(s){return (Number(s?.level)||1)*100000000 + (Number(s?.xp)||0)*1000 + (Number(s?.coins)||0) + (Number(s?.tickets)||0)*100000;}
let S=readState(SAVE_KEY);
if(!S){
  // One-time migration only. After this point the permanent save is used forever.
  const candidates=LEGACY_KEYS.map(readState).filter(Boolean).map(normalizeState);
  S=candidates.sort((a,b)=>scoreState(b)-scoreState(a))[0] || cloneD();
}
S=normalizeState(S);
function save(){
  try{
    const old=localStorage.getItem(SAVE_KEY);
    if(old) localStorage.setItem(BACKUP_KEY,old);
    localStorage.setItem(SAVE_KEY,JSON.stringify(S));
  }catch(e){ console.warn('LIX CITY save failed',e); }
}
save();
function regenEnergy(){const now=Date.now();if(S.energy>=S.maxEnergy){S.lastEnergyAt=now;return false}const last=Number(S.lastEnergyAt)||now;const gained=Math.floor((now-last)/900000);if(gained>0){const before=S.energy;S.energy=Math.min(S.maxEnergy,S.energy+gained);S.lastEnergyAt=before+gained*900000;if(S.energy>=S.maxEnergy)S.lastEnergyAt=now;save();return S.energy>before}return false}function need(l){return Math.round(500*l+300*Math.pow(Math.max(0,l-1),1.35))}function addXP(n){S.xp+=n;while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;S.house=S.level;toast("🏠 House / Player Level "+S.level+"!")}save();render()}function spend(n){if(S.coins<n){toast("Not enough Coins");return false}S.coins-=n;save();return true}function energy(){regenEnergy();if(S.energy<1){toast("⚡ No Energy — +1 Energy every 15 min");return false}S.energy--;S.lastEnergyAt=Date.now();save();render();return true}function coins(n){S.coins+=n;save();render()}function toast(t){let e=document.querySelector(".toast");if(!e)return;e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",1800)}function nav(a){return`<div class="nav"><div class="navin"><button class="${a==="home"?"active":""}" onclick="show('home')"><b>🏠</b>Home</button><button class="${a==="city"?"active":""}" onclick="show('city')"><b>🏙️</b>City</button><button class="${a==="games"?"active":""}" onclick="show('games')"><b>🎮</b>Games</button><button class="${a==="pets"?"active":""}" onclick="show('pets')"><b>🐾</b>Pets</button><button class="${a==="more"?"active":""}" onclick="show('more')"><b>☰</b>More</button></div></div>`}function energyCountdownText(){regenEnergy();if(S.energy>=S.maxEnergy)return "Full";const last=Number(S.lastEnergyAt)||Date.now();const elapsed=Math.max(0,Date.now()-last);const rem=Math.max(0,900000-(elapsed%900000));const sec=Math.ceil(rem/1000);const m=Math.floor(sec/60),s=sec%60;return `Next +1 in ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}function updateEnergyUI(){regenEnergy();const e=document.getElementById("energyMain");const c=document.getElementById("energyCountdown");if(e)e.textContent=`⚡ ${S.energy}/${S.maxEnergy}`;if(c){c.textContent=energyCountdownText();c.className="energy-countdown"+(S.energy>=S.maxEnergy?" ready":"")}}function startEnergyTicker(){clearInterval(window.energyTicker);updateEnergyUI();window.energyTicker=setInterval(updateEnergyUI,1000)}function shell(c,a){regenEnergy();document.getElementById("app").innerHTML=`<header class="top"><div class="brand"><img src="cellix-logo.webp"></div><div class="stats"><span>⭐ ${S.xp}</span><span><img class="coin-icon" src="coin.png"> ${S.coins}</span><span class="energy-stat"><span id="energyMain" class="energy-main">⚡ ${S.energy}/${S.maxEnergy}</span><span id="energyCountdown" class="energy-countdown">${energyCountdownText()}</span></span></div></header><main class="wrap">${c}</main>${nav(a)}<div class="toast"></div>`;startEnergyTicker()}function show(p){({home,city,games,pets,more}[p])()}

  else toast('🏆 Win! Max Game Level 5');
  save();
}

function pets(){let ready=Date.now()-S.petPlayed>=86400000;shell(`<section class="card"><div class="title"><h2>🐾 Lix Stable</h2><small>Pet Level ${S.pet}</small></div><div class="tile"><div style="font-size:56px">🐶</div><h3>Happy Dog</h3><small>Develop your pet with food and toys.</small></div></section><section class="card"><div class="grid"><div class="tile"><h3>🍖 Basic Food</h3><small>20 Coins</small><br><button class="btn" onclick="petBuy(20)">Buy</button></div><div class="tile"><h3>⚽ Ball</h3><small>100 Coins</small><br><button class="btn" onclick="petBuy(100)">Buy</button></div></div></section><section class="card"><div class="title"><h2>❤️ Daily Play</h2><small>${ready?"Ready":"once / 24h"}</small></div><p>Happy Pet → +1 Energy once per 24h + Pet XP once per 24h.</p><button class="btn" ${ready?"":"disabled"} onclick="petPlay()">${ready?"PLAY WITH PET":"PLAY AGAIN TOMORROW"}</button><button class="btn alt" onclick="takePetToCity()" style="margin-left:8px">🏙️ Pet in City</button></section>`,"pets")}
function petBuy(n){if(!spend(n))return;S.pet=Math.min(10,S.pet+1);save();toast("🐶 Pet Level "+S.pet);show("pets")}function petPlay(){if(Date.now()-S.petPlayed<86400000)return;S.petPlayed=Date.now();S.energy=Math.min(S.maxEnergy,S.energy+1);addXP(25+S.pet*5);S.missions[3].done=true;save();toast("❤️ Happy Pet! +1 Energy");show("pets")}function takePetToCity(){S.city=S.city||{};S.city.pet=true;save();toast("🐶 Your pet joined Lix in the city!");show("city")}
function spin(){if(Date.now()-S.lastSpin<86400000){toast("🎡 Spin available once every 24h");return}let r=[20,30,50,75,100,1][Math.floor(Math.random()*6)];S.lastSpin=Date.now();r===1?S.tickets++:S.coins+=r;save();toast(r===1?"🎟️ +1 Ticket!":"🎡 +"+r+" Coins!");show("more")}function more(){let ready=Date.now()-S.lastSpin>=86400000;shell(`<section class="card"><div class="title"><h2>☰ More</h2></div><div class="tile center"><h3>🎡 Daily Spin</h3><div class="spin"></div><button class="btn" onclick="spin()" ${ready?"":"disabled"}>${ready?"SPIN NOW":"READY TOMORROW"}</button><p><small>One spin every 24 hours.</small></p></div><div class="tile"><h3>🏆 Leaderboards</h3><small>${S.level>=10?"Unlocked":"Unlock at Player Level 10."}</small></div></section>`,"more")}function render(){show("home")}try{render()}catch(err){document.getElementById("app").innerHTML=`<main style="font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123"><h2>⚠️ LIX CITY</h2><p>تعذّر تحميل اللعبة.</p><button onclick="localStorage.clear();location.reload()" style="padding:14px 20px;border:0;border-radius:12px;background:#1769e8;color:white;font-weight:700">RESET GAME</button><p style="font-size:12px;opacity:.65">${String(err&&err.message||err)}</p></main>`;console.error(err)}

</script>
</body>
</html>
