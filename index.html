<div id="app"><main style="font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123"><h2>🏙️ LIX CITY</h2><p>Loading…</p></main></div>
<script>
window.addEventListener('error',function(e){try{var a=document.getElementById('app');if(a&&!a.dataset.booted){a.innerHTML='<main style=\"font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123\"><h2>⚠️ LIX CITY</h2><p>حدث خطأ أثناء تحميل اللعبة.</p><p style=\"font-size:12px;opacity:.7\">'+String(e.message||'Unknown error')+'</p></main>'}}catch(_){} });
// LIX CITY v0.44 — SAVE PROTECTION + INSTALL
// Game updates must NEVER change this key.
const SAVE_KEY = "lixcity_player_save_v1";
const LEGACY_KEYS = ["lixcity_v10","lixcity_v09","lixcity_v06","lixcity_v05","lixcity_v04","lixcity_v03","lixcity_v02","lixcity_save_v1","lixcity_player_save","lixcity_player_save_v2"];
const BACKUP_KEY = "lixcity_player_save_backup_v1";
const D={level:1,xp:0,coins:250,tickets:0,energy:10,maxEnergy:10,lastEnergyAt:Date.now(),nextEnergyAt:0,house:1,pet:1,petPlayed:0,lastSpin:0,streakDay:0,lastStreakClaim:0,game:{target:1,runner:1,catch:1},gameUp:{target:1,runner:1,catch:1},missions:[],missionResetAt:Date.now(),missionRefreshes:0,missionRefreshResetAt:Date.now(),city:{x:50,y:50,pet:true,collected:[]},petData:{type:"dog",name:"Lix Pet",food:0,toys:0,petXP:0,petLevel:1,lastPlay:0,active:true,owned:["dog"]},playerId:"LIX-"+Math.random().toString(36).slice(2,8).toUpperCase(),nickname:"Lix Player",country:"Lebanon",likes:0,visits:{},likedCities:{}};
function cloneD(){return JSON.parse(JSON.stringify(D))}
function readState(k){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function normalizeState(raw){
  const s={...cloneD(),...(raw&&typeof raw==='object'?raw:{})};
  s.level=Math.max(1,Number(s.level)||1); s.xp=Math.max(0,Number(s.xp)||0); s.coins=Math.max(0,Number(s.coins)||0);
  s.tickets=Math.max(0,Number(s.tickets)||0); s.maxEnergy=Math.max(10,Number(s.maxEnergy)||10);
  s.energy=Math.max(0,Math.min(s.maxEnergy,Number(s.energy)||0));
  s.lastEnergyAt=Number(s.lastEnergyAt)||Date.now(); s.nextEnergyAt=Number(s.nextEnergyAt)||0;
  if(s.energy>=s.maxEnergy)s.nextEnergyAt=0;
  s.house=Math.max(1,Number(s.house)||s.level||1);
  s.game=s.game&&typeof s.game==="object"?s.game:{target:1,runner:1,catch:1};
  s.gameUp=s.gameUp&&typeof s.gameUp==="object"?s.gameUp:{target:1,runner:1,catch:1};
  s.missions=Array.isArray(s.missions)?s.missions:cloneD().missions;
  s.city=s.city&&typeof s.city==="object"?s.city:{x:50,y:50,pet:true,collected:[]};
  s.city.x=Number.isFinite(Number(s.city.x))?Number(s.city.x):50; s.city.y=Number.isFinite(Number(s.city.y))?Number(s.city.y):50;
  s.city.pet=!!s.city.pet; s.city.collected=Array.isArray(s.city.collected)?s.city.collected:[];
  return s;
}
function scoreState(s){
  return (Number(s?.level)||1)*100000000+(Number(s?.xp)||0)*1000+(Number(s?.coins)||0)+(Number(s?.tickets)||0)*100000+(Number(s?.house)||1)*10000;
}
function isGameSave(x){
  return !!(x&&typeof x==="object" &&
    (Object.prototype.hasOwnProperty.call(x,"level")||Object.prototype.hasOwnProperty.call(x,"xp")) &&
    (Object.prototype.hasOwnProperty.call(x,"coins")||Object.prototype.hasOwnProperty.call(x,"energy")) &&
    (Object.prototype.hasOwnProperty.call(x,"house")||x.game||x.gameUp));
}

/* SAVE RECOVERY:
   Scan the current save, backup, known old keys, and any localStorage entries
   that look like a LIX CITY save. Never replace a stronger save with defaults. */
const candidates=[];
function addCandidate(raw,key){
  if(!isGameSave(raw))return;
  const n=normalizeState(raw);
  candidates.push({key,state:n,score:scoreState(n)});
}
addCandidate(readState(SAVE_KEY),SAVE_KEY);
addCandidate(readState(BACKUP_KEY),BACKUP_KEY);
LEGACY_KEYS.forEach(k=>addCandidate(readState(k),k));
try{
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||k===SAVE_KEY||k===BACKUP_KEY||LEGACY_KEYS.includes(k))continue;
    const raw=readState(k);
    if(raw&&isGameSave(raw))addCandidate(raw,k);
  }
}catch(e){}

candidates.sort((a,b)=>b.score-a.score);
S=(candidates.length?candidates[0].state:cloneD());

S=normalizeState(S);

/* FINAL ONE-TIME RECOVERY
   The user's last confirmed state before the save problem was:
   Level 2 / House 2 / 432 XP / 236 Coins / 10 Energy.
   This recovery runs only when the current account is still the fresh
   Level-1 state. It uses a new marker so earlier failed recovery attempts
   cannot block it. */
const RECOVERY_V2_KEY="lixcity_recovery_v2_done";
try{
  const alreadyRecovered=localStorage.getItem(RECOVERY_V2_KEY)==="1";
  const currentLevel=Number(S.level)||1;
  const currentHouse=Number(S.house)||1;

  if(!alreadyRecovered && currentLevel===1 && currentHouse===1){
    S.level=2;
    S.house=2;
    S.xp=432;
    S.coins=236;
    S.energy=10;
    S.maxEnergy=Math.max(10,Number(S.maxEnergy)||10);
    S.lastEnergyAt=Date.now();
    S.nextEnergyAt=0;
    localStorage.setItem(RECOVERY_V2_KEY,"1");
  }
}catch(e){console.warn("LIX CITY recovery unavailable",e)}

function save(){
  try{
    const old=localStorage.getItem(SAVE_KEY);
    if(old && old!==JSON.stringify(S)) localStorage.setItem(BACKUP_KEY,old);
    localStorage.setItem(SAVE_KEY,JSON.stringify(S));
  }catch(e){console.warn("LIX CITY save failed",e)}
}
save();
function resetDailyMissionsIfNeeded(){const now=Date.now();if(now-S.missionResetAt>=86400000){S.missions=cloneD().missions.map(m=>({...m}));S.missionResetAt=now;save();return true}return false}
function refreshMission(i){resetDailyMissionsIfNeeded();const now=Date.now();if(now-S.missionRefreshResetAt>=86400000){S.missionRefreshes=0;S.missionRefreshResetAt=now}const m=S.missions[i];if(!m||m.done){toast("Mission already completed");return}const cost=S.missionRefreshes===0?0:100;if(cost>0&&!spend(cost))return;const fresh=cloneD().missions[i];S.missions[i]={...fresh};S.missionRefreshes++;save();toast(cost===0?"🔄 Free mission refresh used":"🔄 Mission refreshed • -100 Coins");show("home")}
function missionProgress(i,amount=1){resetDailyMissionsIfNeeded();const m=S.missions[i];if(!m||m.done)return; m.progress=Math.min(m.target,m.progress+amount);save()}
function missionReady(m){return !!m&&!m.done&&Number(m.progress)>=Number(m.target)}
function regenEnergy(){
  const now=Date.now();
  if(S.energy>=S.maxEnergy){
    S.energy=S.maxEnergy;
    S.nextEnergyAt=0;
    return false;
  }
  let next=Number(S.nextEnergyAt);
  if(!Number.isFinite(next)||next<=0){
    const last=Number(S.lastEnergyAt)||now;
    next=last+900000;
    if(next<=now) next=now+900000;
    S.nextEnergyAt=next;
    save();
    return false;
  }
  let changed=false;
  while(S.energy<S.maxEnergy && now>=S.nextEnergyAt){
    S.energy+=1;
    S.lastEnergyAt=S.nextEnergyAt;
    changed=true;
    if(S.energy<S.maxEnergy) S.nextEnergyAt+=900000;
    else S.nextEnergyAt=0;
  }
  if(changed) save();
  return changed;
}
function streakStatus(){const now=Date.now(), day=86400000; const last=Number(S.lastStreakClaim)||0; if(!last)return {ready:true,day:1}; const diff=Math.floor((now-last)/day); if(diff===0)return {ready:false,day:Math.max(1,S.streakDay||1)}; if(diff===1)return {ready:true,day:Math.min(7,(S.streakDay||0)+1)}; return {ready:true,day:1}}

function need(l){return Math.round(500*l+300*Math.pow(Math.max(0,l-1),1.35))}function addXP(n){S.xp+=n;while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;S.house=S.level;toast("🏠 House / Player Level "+S.level+"!")}save();render()}function spend(n){if(S.coins<n){toast("Not enough Coins");return false}S.coins-=n;save();return true}function energy(){regenEnergy();if(S.energy<1){toast("⚡ No Energy — next +1 in 15 min");return false}const wasFull=S.energy>=S.maxEnergy;S.energy--;if(wasFull)S.nextEnergyAt=Date.now()+900000;else if(!S.nextEnergyAt||S.nextEnergyAt<=Date.now())S.nextEnergyAt=Date.now()+900000;missionProgress(0,1);save();try{updateEnergyUI();}catch(e){}return true}function coins(n){const gain=Math.max(0,Number(n)||0);S.coins+=gain;S.events=S.events||{};S.events.launch=S.events.launch||{plays:0,coins:0,claimed:false};S.events.launch.coins=(S.events.launch.coins||0)+gain;missionProgress(1,gain);save();render()}function toast(t){let e=document.querySelector(".toast");if(!e)return;e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",1800)}function nav(a){return`<div class="nav"><div class="navin"><button class="${a==="home"?"active":""}" onclick="show('home')"><b>🏠</b>Home</button><button class="${a==="city"?"active":""}" onclick="show('city')"><b>🏙️</b>City</button><button class="${a==="games"?"active":""}" onclick="show('games')"><b>🎮</b>Games</button><button class="${a==="pets"?"active":""}" onclick="show('pets')"><b>🐾</b>Pets</button><button class="${a==="more"?"active":""}" onclick="show('more')"><b>☰</b>More</button></div></div>`}function energyCountdownText(){regenEnergy();if(S.energy>=S.maxEnergy)return "Full";const next=Number(S.nextEnergyAt)||Date.now()+900000;const rem=Math.max(0,next-Date.now());const sec=Math.ceil(rem/1000);const m=Math.floor(sec/60),s=sec%60;return `Next +1 in ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}function updateEnergyUI(){regenEnergy();const e=document.getElementById("energyMain");const c=document.getElementById("energyCountdown");if(e)e.textContent=`⚡ ${S.energy}/${S.maxEnergy}`;if(c){c.textContent=energyCountdownText();c.className="energy-countdown"+(S.energy>=S.maxEnergy?" ready":"")}}function startEnergyTicker(){clearInterval(window.energyTicker);updateEnergyUI();window.energyTicker=setInterval(updateEnergyUI,1000)}function shell(c,a){regenEnergy();document.getElementById("app").innerHTML=`<header class="top"><div class="brand"><img src="cellix-logo.webp"></div><div class="stats"><span>⭐ ${S.xp}</span><span><img class="coin-icon" src="coin.png"> ${S.coins}</span><span class="energy-stat"><span id="energyMain" class="energy-main">⚡ ${S.energy}/${S.maxEnergy}</span><span id="energyCountdown" class="energy-countdown">${energyCountdownText()}</span></span></div></header><main class="wrap">${c}</main>${nav(a)}<div class="toast"></div>`;startEnergyTicker();updateInstallUI()}function show(p){

window.__lixGameBooting=false;
window.__lixGameName="";
function lixGameStartGuard(name){
  if(window.__lixGameBooting || window.__activeGameCleanup){
    toast("🎮 A game is already running");
    return false;
  }
  if(!energy()) return false;
  window.__lixGameBooting=true;
  window.__lixGameName=name;
  try{
    if(window.LixGameEngine && typeof LixGameEngine.start==="function") LixGameEngine.start(name);
  }catch(e){ console.warn("Game engine start failed",e); }
  return true;
}
function lixGameReady(){ window.__lixGameBooting=false; return true; }

function gameExit(name){
  window.__lixGameBooting=false;
  try{if(typeof window.__activeGameCleanup==='function'){window.__activeGameCleanup();return;}}catch(e){}
  try{if(window.LixGameEngine)LixGameEngine.finish(name,false,0);}catch(e){}
  toast('Round ended — Energy used, no reward');setTimeout(()=>show('games'),250);
}

 ];
 const eventCatalog=[

function social(){if(S.level<30){shell(`<section class="card center"><h2>🌐 Social City</h2><p class="muted">Unlocks at Player Level 30.</p><div class="badge">LOCKED • Lv.30</div></section>`,"more");return}const demo=[{n:"LixMaster",id:"LIX-A1B2C3",lv:42,score:9820,likes:184},{n:"BlueLix",id:"LIX-D4E5F6",lv:35,score:8010,likes:127},{n:"LixPro",id:"LIX-G7H8J9",lv:30,score:7440,likes:96}];const today=new Date().toISOString().slice(0,10);shell(`<section class="card"><div class="title"><h2>🌐 Social City</h2><small>Unlocked Lv.30</small></div><div class="tile"><h3>👤 ${esc(S.nickname)}</h3><p class="muted">Player ID: <b>${esc(S.playerId)}</b><br>Country: ${esc(S.country)}</p><button class="btn alt" onclick="editProfile()">EDIT PROFILE</button></div></section><section class="card"><div class="title"><h2>🏙️ City Visits</h2><small>One visit per city/day</small></div><p class="muted">Visit another player's city, explore it, and give one Like per day. A successful visit grants +10 XP once per day per city.</p><div class="grid">${demo.map((x,i)=>`<div class="tile"><h3>🏙️ ${x.n}</h3><small>${x.id} • Lv.${x.lv}</small><p>❤️ ${x.likes} likes</p><button class="btn" onclick="visitDemoCity('${x.id}','${x.n}')">${S.visits[x.id]===today?'VISITED TODAY':'VISIT CITY'}</button></div>`).join('')}</div></section><section class="card"><div class="title"><h2>🏆 Leaderboards</h2><small>Global • All-Time</small></div>${leaderboardRows(demo).join('')}</section>`,'more')}
function leaderboardRows(demo){const rows=[...demo,{n:S.nickname,id:S.playerId,lv:S.level,score:S.xp+(S.level*100),likes:S.likes}].sort((a,b)=>b.score-a.score);return rows.map((x,i)=>`<div class="mission"><span><b>#${i+1} ${esc(x.n)}</b><br><small>${esc(x.id)} • Lv.${x.lv}</small></span><span>⭐ ${x.score}</span></div>`)}
function editProfile(){const n=prompt('Nickname',S.nickname);if(n===null)return;S.nickname=String(n).trim().slice(0,18)||'Lix Player';save();social()}

function eventData(){const now=Date.now();const start=new Date();start.setHours(0,0,0,0);const end=new Date(start.getTime()+7*86400000-1);return {id:"launch",name:"Lix City Launch Week",icon:"🎉",start:start.getTime(),end:end.getTime(),objectives:[{id:"plays",name:"Play Games",need:3,reward:100,progress:Number(S.events?.launch?.plays)||0},{id:"coins",name:"Earn Event Coins",need:200,reward:150,progress:Number(S.events?.launch?.coins)||0}],points:(Number(S.events?.launch?.plays)||0)*25+Math.min(200,Number(S.events?.launch?.coins)||0)}}
function events(){const e=eventData(), active=Date.now()>=e.start&&Date.now()<=e.end, done=e.objectives.every(o=>o.progress>=o.need), claimed=!!S.events?.launch?.claimed;const remain=Math.max(0,e.end-Date.now());const days=Math.floor(remain/86400000),hrs=Math.floor(remain%86400000/3600000);shell(`<section class="card"><div class="title"><h2>${e.icon} ${e.name}</h2><span class="badge ${active?'now':''}">${active?'ACTIVE':'ENDED'}</span></div><p class="muted">Limited-time event • ${days}d ${hrs}h remaining</p><div class="tile"><h3>Event Points: ${e.points}</h3><p class="muted">Complete objectives to earn Event Points.</p></div></section><section class="card"><div class="title"><h2>🎯 Objectives</h2><small>Rewards are XP</small></div>${e.objectives.map(o=>{const prog=Math.min(o.need,o.progress);return `<div class="mission"><span><b>${o.name}</b><br><small>${prog}/${o.need} • +${o.reward} XP</small><div class="progress" style="margin-top:7px"><div class="bar" style="width:${Math.min(100,prog/o.need*100)}%"></div></div></span></div>`}).join('')}<button class="btn" ${(!active||!done||claimed)?'disabled':''} onclick="claimEvent()">${claimed?'CLAIMED':done?'CLAIM EVENT REWARDS':'COMPLETE OBJECTIVES'}</button></section><section class="card"><div class="tile"><h3>🎁 Event Reward</h3><p class="muted">Complete all objectives to claim <b>+250 XP</b>.</p><small>Event progress is saved with your player account.</small></div></section>`,'more')}
function claimEvent(){const e=eventData();if(Date.now()>e.end){toast('🎉 Event ended');return}if(S.events.launch.claimed){toast('Already claimed');return}if(!e.objectives.every(o=>o.progress>=o.need)){toast('Complete all event objectives first');return}S.events.launch.claimed=true;addXP(250);save();toast('🎉 Event reward claimed! +250 XP');events()}
function more(){shell(`<section class="card"><div class="title"><h2>☰ More</h2></div><div class="tile"><h3>👕 Lix Customization</h3><small>Clothes, shoes, accessories and home decor.</small><br><button class="btn" onclick="customization()">OPEN CUSTOMIZATION</button></div><div class="tile"><h3>🌐 Social City</h3><small>${S.level>=30?"Visit cities, like and explore.":"Unlock at Player Level 30."}</small><br><button class="btn alt" onclick="social()" ${S.level>=30?"":"disabled"}>OPEN SOCIAL</button></div><div class="tile"><h3>🏆 Leaderboards</h3><small>${S.level>=10?"Available inside Games.":"Unlock at Player Level 10."}</small></div><div class="tile"><h3>🎉 Events</h3><small>Limited-time challenges and rewards.</small><br><button class="btn" onclick="events()">OPEN EVENTS</button><br><button class="btn alt" onclick="LixV18.open()">🚀 OPEN LIX HUB 1.8</button></div><div class="tile"><h3>🎟️ Tickets</h3><small>Tickets are rare rewards from Spin and special events.</small></div></section>` ,"more")}
function render(){show("home")}try{render()}catch(err){document.getElementById("app").innerHTML=`<main style="font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123"><h2>⚠️ LIX CITY</h2><p>تعذّر تحميل اللعبة.</p><button onclick="location.reload()" style="padding:14px 20px;border:0;border-radius:12px;background:#1769e8;color:white;font-weight:700">RESET GAME</button><p style="font-size:12px;opacity:.65">${String(err&&err.message||err)}</p></main>`;console.error(err)}

      }).join('')+'</div>';

<script>
(function(){
 const KEY='lixCityCityDevV63';
 const defs=[
  {id:'roads',icon:'🛣️',name:'City Roads',unlock:1,max:5,base:250,desc:'Improve movement and city appearance.'},
  {id:'lighting',icon:'💡',name:'City Lights',unlock:5,max:5,base:400,desc:'Add a brighter evening city atmosphere.'},
  {id:'land',icon:'🌳',name:'Green Spaces',unlock:7,max:5,base:600,desc:'Develop parks and green areas.'},
  {id:'services',icon:'⚡',name:'City Services',unlock:8,max:5,base:900,desc:'Develop the city service network.'}
 ];
 function data(){
  if(!window.S)return {};
  S.cityDev=S.cityDev&&typeof S.cityDev==='object'?S.cityDev:{};
  defs.forEach(d=>{S.cityDev[d.id]=Math.max(0,Math.min(d.max,Number(S.cityDev[d.id])||0));});
  return S.cityDev;
 }
 function cost(d){const lv=Number(data()[d.id])||0;return Math.round(d.base*Math.pow(1.55,lv));}
 function upgrade(id){
  const d=defs.find(x=>x.id===id);if(!d||!window.S)return;
  const dev=data(),lv=Number(dev[id])||0;
  if((Number(S.level)||1)<d.unlock){toast('🔒 Unlocks at Level '+d.unlock);return;}
  if(lv>=d.max){toast('🏙️ Max development level');return;}
  const c=cost(d);if((Number(S.coins)||0)<c){toast('🪙 You need '+c+' Coins');return;}
  S.coins-=c;dev[id]=lv+1;
  if(typeof addXP==='function')addXP(Math.round(c/25));
  else S.xp=(Number(S.xp)||0)+Math.round(c/25);
  if(typeof save==='function')save();
  toast('🏙️ '+d.name+' upgraded to Lv.'+(lv+1));render();
 }
 function render(){
  const host=document.getElementById('v63City');if(!host||!window.S)return;
  if(!document.getElementById('cityViewport')){host.innerHTML='';return;}
  const dev=data(),lvl=Number(S.level)||1;
  const total=defs.reduce((a,d)=>a+(Number(dev[d.id])||0),0),max=defs.reduce((a,d)=>a+d.max,0);
  host.innerHTML='<div class="v63-card"><div class="v63-head"><h3>🏗️ City Development</h3><span class="v63-badge">v0.63</span></div><div class="v63-sub">Use Coins to develop your city. Development is saved with your player.</div><div class="v63-grid">'+defs.map(d=>{const lv=Number(dev[d.id])||0,locked=lvl<d.unlock,c=cost(d);return '<div class="v63-item"><div class="v63-icon">'+d.icon+'</div><div><b>'+d.name+' • Lv.'+lv+'/'+d.max+'</b><div class="v63-meta">'+(locked?'🔒 Unlock at Level '+d.unlock:d.lv===d.max?'MAX':d.desc+' • Next '+c+' 🪙')+'</div><div class="v63-progress"><i style="width:'+Math.round(lv/d.max*100)+'%"></i></div></div><button '+(locked||lv>=d.max||Number(S.coins)<c?'disabled':'')+' onclick="LixCityDev.upgrade(\''+d.id+'\')">'+(lv>=d.max?'MAX':locked?'LOCKED':'UPGRADE')+'</button></div>';}).join('')+'</div><div class="v63-total"><span>Development</span><span>'+total+' / '+max+'</span></div></div>';
 }
 window.LixCityDev={upgrade,render};
 const oldShow=window.show;
 if(typeof oldShow==='function')window.show=function(){const r=oldShow.apply(this,arguments);setTimeout(render,0);return r;};
 const oldCity=window.city;
 if(typeof oldCity==='function')window.city=function(){oldCity.apply(this,arguments);setTimeout(render,0);};
 document.addEventListener('DOMContentLoaded',function(){setTimeout(render,700);});
})();
</script>
