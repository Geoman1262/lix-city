<div id="gcReal" class="gc-real"></div>

<script>
(function(){
  function gcLevel(k){ return Number((window.S&&S.game&&S.game[k])||1); }
  function upLevel(k){ return Number((window.S&&S.gameUp&&S.gameUp[k])||1); }
  function renderGameCenter(){
    const el=document.getElementById("gcReal");
    if(!el || !window.S) return;
    const games=[
      ["target","🎯","Lix Target","Hit targets and build your score."],
      ["runner","🏃","Lix Runner","Run farther and avoid obstacles."],
      ["catch","🪙💣","Lix Catch & Bomb","Collect coins and avoid bombs."]
    ];
    el.innerHTML='<h3>🎮 Game Center</h3><div class="gc-sub">Your games • Game Level and upgrades</div><div class="gc-games">'+
      games.map(g=>'<div class="gc-game"><div class="ico">'+g[1]+'</div><div class="info"><div class="name">'+g[2]+'</div><div class="meta">'+g[3]+'</div><div class="gc-up">Game Lv.'+gcLevel(g[0])+' • Upgrade Lv.'+upLevel(g[0])+'</div></div><button class="play" onclick="show(\'games\')">PLAY</button></div>').join('')+
      '</div>';
  }
  window.renderGameCenter=renderGameCenter;
  document.addEventListener("DOMContentLoaded",renderGameCenter);
  const oldSave=window.save;
  if(typeof oldSave==="function"){
    window.save=function(){ const r=oldSave.apply(this,arguments); renderGameCenter(); return r; };
  }
})();
</script>

<div id="gcUpgradeReal"></div>

<script>
(function(){
  const upgradeCosts={target:[0,150,350,700,1200],runner:[0,150,350,700,1200],catch:[0,200,450,850,1400]};
  const upgradeBonus=[0,5,10,15,20];
  function renderGameUpgrades(){
    const host=document.getElementById("gcUpgradeReal");
    if(!host || !window.S) return;
    const games=[
      ["target","🎯","Target"],
      ["runner","🏃","Runner"],
      ["catch","🪙💣","Catch & Bomb"]
    ];
    host.innerHTML='<div class="gc-upgrade-box"><div class="gc-upgrade-head"><b>⚙️ Game Upgrades</b><span>Coins: 🪙 '+(Number(S.coins)||0)+'</span></div>'+
      games.map(g=>{
        const lv=Math.max(1,Number(S.gameUp?.[g[0]])||1);
        const next=Math.min(5,lv+1);
        const max=lv>=5;
        const cost=max?0:(upgradeCosts[g[0]][lv]||0);
        const can=!max&&(Number(S.coins)||0)>=cost;
        return '<div class="gc-upgrade-actions" style="margin-bottom:8px;align-items:center">'+
          '<span style="min-width:110px;font-size:12px;font-weight:800">'+g[1]+' '+g[2]+' Lv.'+lv+'</span>'+
          '<button '+(can?'':'disabled')+' onclick="upgradeLixGame(\''+g[0]+'\')">'+
          (max?'MAX • +20%':'Upgrade → Lv.'+next+' • '+cost+' 🪙')+
          '</button></div>';
      }).join('')+'</div>';
  }
  window.upgradeLixGame=function(key){
    const costs=upgradeCosts[key];
    if(!window.S || !costs) return;
    const lv=Math.max(1,Number(S.gameUp?.[key])||1);
    if(lv>=5) return;
    const cost=costs[lv]||0;
    if((Number(S.coins)||0)<cost){ if(typeof toast==="function") toast("Not enough Coins"); return; }
    S.coins-=cost;
    S.gameUp=S.gameUp||{};
    S.gameUp[key]=lv+1;
    if(typeof save==="function") save();
    if(typeof renderGameCenter==="function") renderGameCenter();
    renderGameUpgrades();
    if(typeof toast==="function") toast("⚙️ "+key+" upgraded to Lv."+ (lv+1));
  };
  window.renderGameUpgrades=renderGameUpgrades;
  document.addEventListener("DOMContentLoaded",renderGameUpgrades);
})();
</script>

<script>
(function(){
  function xpNeed(l){ return Math.max(500, Math.round(500 + (l-1)*300 + Math.pow(Math.max(0,l-1),1.45)*90)); }
  function renderMajor(){
    const h=document.getElementById("lixMajorBundle");
    if(!h || !window.S) return;
    const lvl=Number(S.level)||1, xp=Number(S.xp)||0, coins=Number(S.coins)||0;
    const need=xpNeed(lvl), pct=Math.min(100,Math.round((xp/need)*100));
    const streak=Math.max(0,Number(S.streakDay)||0);
    const spinReady=!S.lastSpin || (Date.now()-Number(S.lastSpin)>=86400000);
    const missions=Array.isArray(S.missions)?S.missions:[];
    const done=missions.filter(m=>m&&m.claimed).length;

    h.innerHTML=
      '<div class="lix-card">'+
        '<div class="lix-card-head"><h3>🏠 House Progress</h3><span class="lix-pill">Lv.'+lvl+'</span></div>'+
        '<div class="lix-muted">'+xp+' / '+need+' XP to next level</div>'+
        '<div class="lix-progress"><i style="width:'+pct+'%"></i></div>'+
        '<div class="lix-statgrid"><div class="lix-stat"><b>⭐ '+xp+'</b><span>XP</span></div><div class="lix-stat"><b>🪙 '+coins+'</b><span>Coins</span></div><div class="lix-stat"><b>🔥 '+streak+'</b><span>Streak</span></div></div>'+
      '</div>'+
      '<div class="lix-card">'+
        '<div class="lix-card-head"><h3>🎯 Daily Missions</h3><span class="lix-pill">'+done+'/'+missions.length+'</span></div>'+
        (missions.length ? missions.map((m,i)=>'<div class="lix-row"><div class="grow"><b>'+(m.title||m.name||('Mission '+(i+1)))+'</b><br><span class="lix-muted">'+(m.xp||0)+' XP</span></div><span class="lix-pill">'+(m.claimed?'CLAIMED':'ACTIVE')+'</span></div>').join('') : '<div class="lix-muted">Your 5 daily missions will appear here.</div>')+
      '</div>'+
      '<div class="lix-card">'+

<script>
(function(){
 const KEY='lixCityCityDevV63';
 const defs=[
  {id:'roads',icon:'🛣️',name:'City Roads',unlock:1,max:5,base:250,desc:'Improve movement and city appearance.'},
  {id:'lighting',icon:'💡',name:'City Lights',unlock:5,max:5,base:400,desc:'Add a brighter evening city atmosphere.'},
  {id:'land',icon:'🌳',name:'Green Spaces',unlock:7,max:5,base:600,desc:'Develop parks and green areas.'},
  {id:'services',icon:'⚡',name:'City Services',unlock:8,max:5,base:900,desc:'Develop the city service network.'}
 ];
 function data(){
  if(!window.S)return {};
  S.cityDev=S.cityDev&&typeof S.cityDev==='object'?S.cityDev:{};
  defs.forEach(d=>{S.cityDev[d.id]=Math.max(0,Math.min(d.max,Number(S.cityDev[d.id])||0));});
  return S.cityDev;
 }
 function cost(d){const lv=Number(data()[d.id])||0;return Math.round(d.base*Math.pow(1.55,lv));}
 function upgrade(id){
  const d=defs.find(x=>x.id===id);if(!d||!window.S)return;
  const dev=data(),lv=Number(dev[id])||0;
  if((Number(S.level)||1)<d.unlock){toast('🔒 Unlocks at Level '+d.unlock);return;}
  if(lv>=d.max){toast('🏙️ Max development level');return;}
  const c=cost(d);if((Number(S.coins)||0)<c){toast('🪙 You need '+c+' Coins');return;}
  S.coins-=c;dev[id]=lv+1;
  if(typeof addXP==='function')addXP(Math.round(c/25));
  else S.xp=(Number(S.xp)||0)+Math.round(c/25);
  if(typeof save==='function')save();
  toast('🏙️ '+d.name+' upgraded to Lv.'+(lv+1));render();
 }
 function render(){
  const host=document.getElementById('v63City');if(!host||!window.S)return;
  if(!document.getElementById('cityViewport')){host.innerHTML='';return;}
  const dev=data(),lvl=Number(S.level)||1;
  const total=defs.reduce((a,d)=>a+(Number(dev[d.id])||0),0),max=defs.reduce((a,d)=>a+d.max,0);
  host.innerHTML='<div class="v63-card"><div class="v63-head"><h3>🏗️ City Development</h3><span class="v63-badge">v0.63</span></div><div class="v63-sub">Use Coins to develop your city. Development is saved with your player.</div><div class="v63-grid">'+defs.map(d=>{const lv=Number(dev[d.id])||0,locked=lvl<d.unlock,c=cost(d);return '<div class="v63-item"><div class="v63-icon">'+d.icon+'</div><div><b>'+d.name+' • Lv.'+lv+'/'+d.max+'</b><div class="v63-meta">'+(locked?'🔒 Unlock at Level '+d.unlock:d.lv===d.max?'MAX':d.desc+' • Next '+c+' 🪙')+'</div><div class="v63-progress"><i style="width:'+Math.round(lv/d.max*100)+'%"></i></div></div><button '+(locked||lv>=d.max||Number(S.coins)<c?'disabled':'')+' onclick="LixCityDev.upgrade(\''+d.id+'\')">'+(lv>=d.max?'MAX':locked?'LOCKED':'UPGRADE')+'</button></div>';}).join('')+'</div><div class="v63-total"><span>Development</span><span>'+total+' / '+max+'</span></div></div>';
 }
 window.LixCityDev={upgrade,render};
 const oldShow=window.show;
 if(typeof oldShow==='function')window.show=function(){const r=oldShow.apply(this,arguments);setTimeout(render,0);return r;};
 const oldCity=window.city;
 if(typeof oldCity==='function')window.city=function(){oldCity.apply(this,arguments);setTimeout(render,0);};
 document.addEventListener('DOMContentLoaded',function(){setTimeout(render,700);});
})();
</script>
