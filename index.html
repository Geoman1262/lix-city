  const now=Date.now();
  if(S.energy>=S.maxEnergy){
    S.energy=S.maxEnergy;
    S.nextEnergyAt=0;
    return false;
  }
  let next=Number(S.nextEnergyAt);
  if(!Number.isFinite(next)||next<=0){
    const last=Number(S.lastEnergyAt)||now;
    next=last+900000;
    if(next<=now) next=now+900000;
    S.nextEnergyAt=next;
    save();

  }
  let changed=false;
  while(S.energy<S.maxEnergy && now>=S.nextEnergyAt){

    S.lastEnergyAt=S.nextEnergyAt;

function gameUpgradeInfo(name){const lv=Math.max(1,Math.min(5,Number(S.gameUp?.[name])||1));const costs=[0,250,500,900,1400];const bonus=(lv-1)*5;return {level:lv,cost:costs[lv],bonus};}

function gameWin(name,earnedCoins,xp){
  const old=Math.max(1,Math.min(5,Number(S.game?.[name])||1));
  const up=gameUpgradeInfo(name);
  const coinReward=earnedCoins>0?Math.round(earnedCoins*(1+up.bonus/100)):0;
  const xpReward=Math.round(xp*(1+up.bonus/100));
  if(coinReward>0){S.coins+=coinReward;missionProgress(1,coinReward)}
  addXP(xpReward);
  missionProgress(0,1);
  if(name==='target') missionProgress(2,1);
  if(old<5){S.game[name]=old+1;toast('🏆 Win! +'+coinReward+' Coins +'+xpReward+' XP • Game Lv.'+(old+1));}
  else toast('🏆 Win! +'+coinReward+' Coins +'+xpReward+' XP • Max Game Level');
  save();
}

function petTypeName(t){return ({dog:'Dog',cat:'Cat',horse:'Horse'})[t]||'Dog'}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function petGainXP(n){let p=S.petData;p.petXP=(Number(p.petXP)||0)+n;while(p.petLevel<10 && p.petXP>=100+p.petLevel*50){p.petXP-=100+p.petLevel*50;p.petLevel++;S.pet=p.petLevel;toast('🐾 Pet Level '+p.petLevel+'!')}S.pet=p.petLevel;save()}
function setPetType(t){if(!S.petData.owned.includes(t)){toast('🔒 Pet locked');return}S.petData.type=t;S.petData.active=true;save();show('pets')}
function savePetName(){const e=document.getElementById('petNameInput');const n=(e?.value||'Lix Pet').trim().slice(0,18);S.petData.name=n||'Lix Pet';save();toast('🐾 Pet name saved');show('pets')}
function petFeed(){if(!spend(20))return;S.petData.food++;S.petData.happiness=Math.min(100,S.petData.happiness+12);petGainXP(20);toast('🍖 '+S.petData.name+' is happier!');show('pets')}
function petToy(){if(!spend(100))return;S.petData.toys++;S.petData.happiness=Math.min(100,S.petData.happiness+20);petGainXP(35);toast('⚽ '+S.petData.name+' had fun!');show('pets')}
function petBuy(n){if(n===20)return petFeed();if(n===100)return petToy()}
function petPlay(){let p=S.petData;if(Date.now()-(Number(p.lastPlay)||0)<86400000)return; p.lastPlay=Date.now();S.petPlayed=p.lastPlay;p.happiness=Math.min(100,p.happiness+15);petGainXP(50);S.energy=Math.min(S.maxEnergy,S.energy+1);missionProgress(3,1);addXP(25+p.petLevel*5);save();toast('❤️ Happy Pet! +1 Energy');show('pets')}
function takePetToCity(){S.city=S.city||{};S.city.pet=true;S.petData.active=true;save();toast('🐾 '+S.petData.name+' joined Lix in the city!');show('city')}
function spin(){if(Date.now()-S.lastSpin<86400000){toast("🎡 Spin available once every 24h");return}let r=[20,30,50,75,100,1][Math.floor(Math.random()*6)];S.lastSpin=Date.now();r===1?S.tickets++:S.coins+=r;save();toast(r===1?"🎟️ +1 Ticket!":"🎡 +"+r+" Coins!");show("home")}function customization(){
 const items=[{id:"blue",cat:"shirt",name:"Blue Jacket",icon:"🧥",cost:150,lv:6},{id:"hoodie",cat:"shirt",name:"Lix Hoodie",icon:"🥼",cost:300,lv:10},{id:"gold",cat:"shirt",name:"Gold Style",icon:"✨",cost:600,lv:15},{id:"runner",cat:"shoe",name:"Runner Shoes",icon:"👟",cost:200,lv:6},{id:"speed",cat:"shoe",name:"Speed Shoes",icon:"⚡",cost:450,lv:12},{id:"glasses",cat:"acc",name:"Cool Glasses",icon:"🕶️",cost:250,lv:8},{id:"cap",cat:"acc",name:"Lix Cap",icon:"🧢",cost:350,lv:12}];
 const owned=id=>S.custom.owned.includes(id);
 const card=items.map(x=>{const can=S.level>=x.lv,is=S.custom.equipped[x.cat]===x.id;let action=!can?`<small>🔒 Unlock at Level ${x.lv}</small>`:is?`<button class="btn alt" disabled>✓ EQUIPPED</button>`:owned(x.id)?`<button class="btn" onclick="equipItem('${x.cat}','${x.id}')">EQUIP</button>`:`<button class="btn" onclick="buyItem('${x.id}',${x.cost})">BUY</button>`;return `<div class="tile ${!can?'locked':''}"><div style="font-size:38px">${x.icon}</div><h3>${x.name}</h3><small>Lv.${x.lv} • ${x.cost} 🪙</small><br>${action}</div>`}).join("");
 shell(`<section class="card"><div class="title"><h2>👕 Lix Customization</h2><small>Unlock from Level 6</small></div><div class="hero" style="margin:0"><div><h2>Your Lix</h2><p>Customize Lix with clothes, shoes and accessories.</p><div class="badge now">Level ${S.level}</div></div><img src="lix.png"></div></section><section class="card"><div class="title"><h2>👕 Clothing & Style</h2><small>Buy & equip</small></div><div class="grid">${card}</div></section><section class="card"><div class="title"><h2>🏠 Home Decor</h2><small>Customize your home</small></div><div class="grid"><div class="tile"><div style="font-size:38px">🛋️</div><h3>Lix Sofa</h3><small>200 Coins • Level 6</small><br><button class="btn" onclick="buyHome('sofa',200,6)">${S.custom.home.includes('sofa')?'OWNED':'BUY'}</button></div><div class="tile"><div style="font-size:38px">🪴</div><h3>City Plant</h3><small>100 Coins • Level 6</small><br><button class="btn" onclick="buyHome('plant',100,6)">${S.custom.home.includes('plant')?'OWNED':'BUY'}</button></div><div class="tile"><div style="font-size:38px">📺</div><h3>Lix TV</h3><small>350 Coins • Level 10</small><br><button class="btn" onclick="buyHome('tv',350,10)">${S.custom.home.includes('tv')?'OWNED':'BUY'}</button></div></div></section>`,"more");
}
function buyItem(id,cost){if(S.custom.owned.includes(id)){toast("Already owned");return}if(!spend(cost))return;S.custom.owned.push(id);addXP(Math.min(50,Math.round(cost/10)));save();toast("👕 Item unlocked!");customization()}
function equipItem(cat,id){S.custom.equipped[cat]=id;save();toast("✨ Equipped!");customization()}
function buyHome(id,cost,lv){if(S.level<lv){toast("🔒 Unlocks at Level "+lv);return}if(S.custom.home.includes(id)){toast("Already owned");return}if(!spend(cost))return;S.custom.home.push(id);addXP(Math.min(40,Math.round(cost/10)));save();toast("🏠 Home item added!");customization()}
function social(){if(S.level<30){shell(`<section class="card center"><h2>🌐 Social City</h2><p class="muted">Unlocks at Player Level 30.</p><div class="badge">LOCKED • Lv.30</div></section>`,"more");return}const demo=[{n:"LixMaster",id:"LIX-A1B2C3",lv:42,score:9820,likes:184},{n:"BlueLix",id:"LIX-D4E5F6",lv:35,score:8010,likes:127},{n:"LixPro",id:"LIX-G7H8J9",lv:30,score:7440,likes:96}];const today=new Date().toISOString().slice(0,10);shell(`<section class="card"><div class="title"><h2>🌐 Social City</h2><small>Unlocked Lv.30</small></div><div class="tile"><h3>👤 ${esc(S.nickname)}</h3><p class="muted">Player ID: <b>${esc(S.playerId)}</b><br>Country: ${esc(S.country)}</p><button class="btn alt" onclick="editProfile()">EDIT PROFILE</button></div></section><section class="card"><div class="title"><h2>🏙️ City Visits</h2><small>One visit per city/day</small></div><p class="muted">Visit another player's city, explore it, and give one Like per day. A successful visit grants +10 XP once per day per city.</p><div class="grid">${demo.map((x,i)=>`<div class="tile"><h3>🏙️ ${x.n}</h3><small>${x.id} • Lv.${x.lv}</small><p>❤️ ${x.likes} likes</p><button class="btn" onclick="visitDemoCity('${x.id}','${x.n}')">${S.visits[x.id]===today?'VISITED TODAY':'VISIT CITY'}</button></div>`).join('')}</div></section><section class="card"><div class="title"><h2>🏆 Leaderboards</h2><small>Global • All-Time</small></div>${leaderboardRows(demo).join('')}</section>`,'more')}
function leaderboardRows(demo){const rows=[...demo,{n:S.nickname,id:S.playerId,lv:S.level,score:S.xp+(S.level*100),likes:S.likes}].sort((a,b)=>b.score-a.score);return rows.map((x,i)=>`<div class="mission"><span><b>#${i+1} ${esc(x.n)}</b><br><small>${esc(x.id)} • Lv.${x.lv}</small></span><span>⭐ ${x.score}</span></div>`)}
function editProfile(){const n=prompt('Nickname',S.nickname);if(n===null)return;S.nickname=String(n).trim().slice(0,18)||'Lix Player';save();social()}
function visitDemoCity(id,name){if(S.level<30){toast('🔒 Social City unlocks at Level 30');return}const today=new Date().toISOString().slice(0,10);if(S.visits[id]===today){toast('🏙️ Already visited today');return}S.visits[id]=today;addXP(10);save();toast('🏙️ Visited '+name+' • +10 XP');social()}
function eventData(){const now=Date.now();const start=new Date();start.setHours(0,0,0,0);const end=new Date(start.getTime()+7*86400000-1);return {id:"launch",name:"Lix City Launch Week",icon:"🎉",start:start.getTime(),end:end.getTime(),objectives:[{id:"plays",name:"Play Games",need:3,reward:100,progress:Number(S.events?.launch?.plays)||0},{id:"coins",name:"Earn Event Coins",need:200,reward:150,progress:Number(S.events?.launch?.coins)||0}],points:(Number(S.events?.launch?.plays)||0)*25+Math.min(200,Number(S.events?.launch?.coins)||0)}}
function events(){const e=eventData(), active=Date.now()>=e.start&&Date.now()<=e.end, done=e.objectives.every(o=>o.progress>=o.need), claimed=!!S.events?.launch?.claimed;const remain=Math.max(0,e.end-Date.now());const days=Math.floor(remain/86400000),hrs=Math.floor(remain%86400000/3600000);shell(`<section class="card"><div class="title"><h2>${e.icon} ${e.name}</h2><span class="badge ${active?'now':''}">${active?'ACTIVE':'ENDED'}</span></div><p class="muted">Limited-time event • ${days}d ${hrs}h remaining</p><div class="tile"><h3>Event Points: ${e.points}</h3><p class="muted">Complete objectives to earn Event Points.</p></div></section><section class="card"><div class="title"><h2>🎯 Objectives</h2><small>Rewards are XP</small></div>${e.objectives.map(o=>{const prog=Math.min(o.need,o.progress);return `<div class="mission"><span><b>${o.name}</b><br><small>${prog}/${o.need} • +${o.reward} XP</small><div class="progress" style="margin-top:7px"><div class="bar" style="width:${Math.min(100,prog/o.need*100)}%"></div></div></span></div>`}).join('')}<button class="btn" ${(!active||!done||claimed)?'disabled':''} onclick="claimEvent()">${claimed?'CLAIMED':done?'CLAIM EVENT REWARDS':'COMPLETE OBJECTIVES'}</button></section><section class="card"><div class="tile"><h3>🎁 Event Reward</h3><p class="muted">Complete all objectives to claim <b>+250 XP</b>.</p><small>Event progress is saved with your player account.</small></div></section>`,'more')}
function claimEvent(){const e=eventData();if(Date.now()>e.end){toast('🎉 Event ended');return}if(S.events.launch.claimed){toast('Already claimed');return}if(!e.objectives.every(o=>o.progress>=o.need)){toast('Complete all event objectives first');return}S.events.launch.claimed=true;addXP(250);save();toast('🎉 Event reward claimed! +250 XP');events()}
function more(){shell(`<section class="card"><div class="title"><h2>☰ More</h2></div><div class="tile"><h3>👕 Lix Customization</h3><small>Clothes, shoes, accessories and home decor.</small><br><button class="btn" onclick="customization()">OPEN CUSTOMIZATION</button></div><div class="tile"><h3>🌐 Social City</h3><small>${S.level>=30?"Visit cities, like and explore.":"Unlock at Player Level 30."}</small><br><button class="btn alt" onclick="social()" ${S.level>=30?"":"disabled"}>OPEN SOCIAL</button></div><div class="tile"><h3>🏆 Leaderboards</h3><small>${S.level>=10?"Available inside Games.":"Unlock at Player Level 10."}</small></div><div class="tile"><h3>🎉 Events</h3><small>Limited-time challenges and rewards.</small><br><button class="btn" onclick="events()">OPEN EVENTS</button></div><div class="tile"><h3>🎟️ Tickets</h3><small>Tickets are rare rewards from Spin and special events.</small></div></section>` ,"more")}
function render(){show("home")}try{render()}catch(err){document.getElementById("app").innerHTML=`<main style="font-family:Arial,sans-serif;padding:28px;text-align:center;color:#123"><h2>⚠️ LIX CITY</h2><p>تعذّر تحميل اللعبة.</p><button onclick="localStorage.clear();location.reload()" style="padding:14px 20px;border:0;border-radius:12px;background:#1769e8;color:white;font-weight:700">RESET GAME</button><p style="font-size:12px;opacity:.65">${String(err&&err.message||err)}</p></main>`;console.error(err)}

</script>


<script>
// Cellix Shop is read-only for players. The Admin Panel publishes shop-config.json.
window.CELLIX_SHOP_CONFIG={enabled:false,products:[]};
fetch('shop-config.json?v=1',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(cfg=>{if(cfg&&Array.isArray(cfg.products)){window.CELLIX_SHOP_CONFIG=cfg;render();}}).catch(()=>{});
</script>
<script>
(function(){
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;const b=document.getElementById("lixInstallButton");if(b)b.style.display="none";});
function showInstallMessage(){
const m=document.createElement("div");m.id="lixInstallModal";m.innerHTML=`<div class="lix-install-backdrop"><div class="lix-install-card"><button class="lix-install-close">×</button><div class="lix-install-icon">📲</div><h2>Install LIX CITY</h2><p>لتثبيت اللعبة على هاتفك:</p><div class="lix-install-steps"><div><b>1</b><span>اضغط على قائمة المتصفح <strong>⋮</strong></span></div><div><b>2</b><span>اختر <strong>Add to Home screen</strong> أو <strong>Install app</strong></span></div><div><b>3</b><span>اضغط <strong>Add</strong> أو <strong>Install</strong></span></div></div><button class="lix-install-ok">حسناً</button></div></div>`;
const st=document.createElement("style");st.textContent=`#lixInstallModal{position:fixed;inset:0;z-index:99999}.lix-install-backdrop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.68);backdrop-filter:blur(5px)}.lix-install-card{position:relative;width:min(390px,100%);box-sizing:border-box;background:linear-gradient(180deg,#fff,#eef7ff);color:#10243a;border-radius:26px;padding:28px 22px 22px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}.lix-install-close{position:absolute;top:10px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:#eaf3fb;font-size:25px}.lix-install-icon{font-size:42px}.lix-install-card h2{margin:5px 0}.lix-install-card p{opacity:.72}.lix-install-steps{text-align:left;display:grid;gap:11px;margin:20px 0}.lix-install-steps div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:12px;box-shadow:0 5px 16px rgba(20,90,140,.08)}.lix-install-steps b{flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#1788e5;color:#fff}.lix-install-ok{width:100%;border:0;border-radius:14px;padding:13px;background:#1788e5;color:#fff;font-weight:800}`;document.head.appendChild(st);document.body.appendChild(m);const close=()=>m.remove();m.querySelector('.lix-install-close').onclick=close;m.querySelector('.lix-install-ok').onclick=close;}
window.lixInstallGame=async function(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null}else showInstallMessage()};
document.addEventListener("click",e=>{const b=e.target.closest("#lixInstallButton");if(b){e.preventDefault();window.lixInstallGame();}});
})();
</script>
